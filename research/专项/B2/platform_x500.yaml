# B2-01 力平衡抗风模型输入(区间均为"设计假设/用户提供",非实测)
platform:
  name: T1_x500
  mass_kg: [3.2, 3.8]           # 起飞质量区间
  T_continuous_N: [60, 80]      # 可用连续推力(非峰值)
  theta_max_deg: [20, 30]       # 悬停最大可用倾角
  C_D_Aeff_m2: [0.35, 0.55]     # 阻力系数×迎风面积
  rho_kg_m3: [1.15, 1.225]      # 空气密度
  eta_v: 0.75                   # 垂直裕度(电池衰减/姿态/控制)
  eta_h: 0.60                   # 水平裕度

# 参数来源标注(报告 params_source 字段引用;论文局限性据此区分"假设 vs 实测")
# 测一项就把对应标签改成 measured 并收紧区间重跑
params_source:
  mass_kg: "design_assumption"        # 待实测(台架称重)
  T_continuous_N: "design_assumption" # 待实测(推重比台架)
  theta_max_deg: "design_assumption"  # 待实测(飞控限幅/最大悬停倾角)
  C_D_Aeff_m2: "design_assumption"    # 待实测(风速-倾角曲线反推/风洞)——敏感性第一,最先测
  rho_kg_m3: "empirical"              # 标准大气常数
  eta_v: "empirical"                  # 经验裕度
  eta_h: "empirical"                  # 经验裕度
