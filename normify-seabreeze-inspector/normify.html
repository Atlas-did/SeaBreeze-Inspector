        "en": "3-DOF arm: forward/inverse kinematics for base, shoulder and elbow (numerical IK with multi-start guesses plus a Jacobian) and a serial controller for the Arduino Nano (A\u003cbase>,\u003cshoulder>,\u003celbow> commands, angle query and homing). Link lengths and serial parameters come from arm_config.yaml.\n"

        "serial"
      ],
      "name": {
        "zh": "机械臂串口控制器",
        "en": "Arm Serial Controller"
      },
      "description": {
        "zh": "经 pyserial 与 Arduino Nano 通信的机械臂控制器：默认串口与波特率取自 arm_config.yaml 的 hardware.serial；set_joint_angles 发送 A\u003cbase>,\u003cshoulder>,\u003celbow> 指令，并按固件 50°/s 的平滑速度估算等待时间；move_to_position 先 IK 再下发角度；get_current_angles 发 Q 并解析 A:90,S:45,E:30；reset 归位到 (90,90,90)。pyserial 缺失或未连接时降级为模拟模式。\n",
        "en": "Arm controller talking to an Arduino Nano over pyserial: the port and baud rate default to hardware.serial in arm_config.yaml; set_joint_angles sends A\u003cbase>,\u003cshoulder>,\u003celbow> and waits based on the firmware's fixed 50 deg/s smoothing; move_to_position solves IK before commanding angles; get_current_angles sends Q and parses A:90,S:45,E:30; reset homes to (90,90,90). Missing pyserial or an unopened port degrades to simulated mode.\n"
      },
      "source": [
        {
          "path": "backend/arm/arm_controller.py",
          "line": 28,
          "end_line": 114
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.793Z",
      "fingerprint": "393dee82392e0bddafaf2ac203694a5a4ef38e749924ef262b40a6822ad12fe2",
      "apis": [
        {
          "protocol": "rpc",
          "path": "ArmController.connect",
          "description": {
            "zh": "打开串口并等待 2s 让 Arduino 复位；缺库或异常时打印原因并返回 False。\n",
            "en": "Opens the serial port and waits 2 s for the Arduino to reset; missing library or errors are logged and return False.\n"
          },
          "key": "rpc:ArmController.connect"
        },
        {
          "protocol": "rpc",
          "path": "ArmController.set_joint_angles",
          "description": {
            "zh": "发送三关节角度指令，并按最大角度差 × 20ms/度 估算等待时间后更新当前角度缓存。\n",
            "en": "Sends the three joint angles, waiting max-angle-delta x 20 ms/deg before updating the cached current angles.\n"
          },
          "key": "rpc:ArmController.set_joint_angles"
        },
        {
          "protocol": "rpc",
          "path": "ArmController.move_to_position",
          "description": {
            "zh": "先 IK 求解 (x,y,z) 得到关节角，再调用 set_joint_angles 下发。\n",
            "en": "Solves IK for (x,y,z) and then dispatches the resulting angles via set_joint_angles.\n"
          },
          "key": "rpc:ArmController.move_to_position"
        },
        {
          "protocol": "rpc",
          "path": "ArmController.get_current_angles",
          "description": {
            "zh": "发送 Q 查询并解析 A:90,S:45,E:30 回复，失败时返回缓存的当前角度。\n",
            "en": "Sends Q and parses the A:90,S:45,E:30 reply, returning the cached angles on failure.\n"
          },
          "key": "rpc:ArmController.get_current_angles"
        },
        {
          "protocol": "rpc",
          "path": "ArmController.reset",
          "description": {
            "zh": "归位到 (90,90,90)。\n",
            "en": "Homes the arm to (90,90,90).\n"
          },
          "key": "rpc:ArmController.reset"
        }
      ],

    "seabreeze-inspector.backend.arm.kinematics": {
      "uid": "3d8f1c65",
      "id": "seabreeze-inspector.backend.arm.kinematics",
      "parent": "seabreeze-inspector.backend.arm",
      "tree": "seabreeze-inspector",

      "tags": [
        "arm",
        "kinematics",
        "ik"
      ],
      "name": {
        "zh": "3DOF 机械臂运动学",
        "en": "3-DOF Arm Kinematics"
      },
      "description": {
        "zh": "底座/大臂/小臂三关节运动学：FK 由 θ1..θ3 求末端 (x,y,z)，其中小臂与末端共线（L23=L2+L3）；IK 用 L-BFGS-B 数值优化加 5×5×4 初始猜测网格搜索，保证与 FK 一致，无 scipy 时退化为解析解并处理 r≈0 与超出工作空间两种退化情形；Jacobian 给出 3×3 雅可比供速度控制。连杆长度优先从 arm_config.yaml 读取。\n",
        "en": "Kinematics for the base/shoulder/elbow joints: FK maps theta1..theta3 to the end-effector (x,y,z) with the forearm and tip collinear (L23=L2+L3); IK runs L-BFGS-B over a 5x5x4 multi-start grid to stay consistent with FK, degrading to an analytic solution without scipy while handling the r~0 and out-of-workspace degeneracies; Jacobian returns the 3x3 Jacobian for velocity control. Link lengths are read from arm_config.yaml first.\n"
      },
      "source": [
        {
          "path": "backend/arm/arm_kinematics.py",
          "line": 24,
          "end_line": 182
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.794Z",
      "fingerprint": "034a4d9a047d174048a902b0aeff4585f9d649f5214492aec9510c8673d452e9",
      "apis": [
        {
          "protocol": "rpc",
          "path": "FK",
          "description": {
            "zh": "正运动学：三关节角度（度）→ 末端位置 (x,y,z) mm。\n",
            "en": "Forward kinematics: joint angles in degrees to end-effector (x,y,z) in mm.\n"
          },
          "key": "rpc:FK"
        },
        {
          "protocol": "rpc",
          "path": "IK",
          "description": {
            "zh": "逆运动学：末端 (x,y,z) mm → [θ1,θ2,θ3] 度，数值优化 + 多初始猜测，失败回退解析解与默认姿态。\n",
            "en": "Inverse kinematics: end-effector (x,y,z) in mm to [theta1,theta2,theta3] in degrees via numerical optimisation with multi-start guesses, falling back to the analytic solution and a default pose.\n"
          },
          "key": "rpc:IK"
        },
        {
          "protocol": "rpc",
          "path": "Jacobian",
          "description": {
            "zh": "计算 3×3 雅可比矩阵，用于关节速度到末端速度的映射。\n",
            "en": "Computes the 3x3 Jacobian mapping joint rates to end-effector velocity.\n"
          },
          "key": "rpc:Jacobian"
        },
        {
          "protocol": "rpc",
          "path": "deg2rad",
          "description": {
            "zh": "角度转弧度的薄封装。\n",
            "en": "Thin degrees-to-radians helper.\n"
          },
          "key": "rpc:deg2rad"
        },
        {
          "protocol": "rpc",
          "path": "rad2deg",
          "description": {
            "zh": "弧度转角度的薄封装，IK 解析分支使用。\n",
            "en": "Thin radians-to-degrees helper used by the analytic IK branch.\n"
          },
          "key": "rpc:rad2deg"
        }
      ],

      ],
      "name": {
        "zh": "EKF 扰动观测器",
        "en": "EKF Disturbance Observer"
      },
      "description": {
        "zh": "12 维全状态扩展卡尔曼扰动观测器。状态 X=[x,y,z,vx,vy,vz,ax,ay,az,dx,dy,dz]，观测 Z=[IMU 加速度×3, 光流位置×2, 气压高度]。常加速度模型 + 扰动随机游走，观测线性无需雅可比；predict(u) 把已知控制加速度灌入状态，从而把 IMU 残差归因于风扰；残差 Mahalanobis 距离超阈值时按 α 放大 Q，加快阵风跟踪。\n",
        "en": "12-state EKF disturbance observer. State X=[x,y,z,vx,vy,vz,ax,ay,az,dx,dy,dz], measurement Z=[IMU accel x3, optical-flow position x2, barometric height]. Constant-acceleration model plus disturbance random walk; the measurement model is linear so no Jacobian is needed. predict(u) injects the known control acceleration so the IMU residual is attributed to wind, and an over-threshold Mahalanobis residual inflates Q by alpha to track gusts faster.\n"
      },

    "seabreeze-inspector.backend.core.feedforward-pid": {

      ],
      "name": {
        "zh": "前馈 PID 位置控制器",
        "en": "Feedforward PID Controller"
      },
      "description": {
        "zh": "位置环控制律 v_cmd = Kp·e + Ki·∫e + Kd·ė + Kff·d_est。含死区、积分限幅与饱和暂停（anti-windup）、D 项 PT1 低通、积分分离；输出按 max_speed 限幅且保持方向，并回传各项分解供诊断。from_config() 从 drone_config.yaml 的 controller/flight 段读取增益、控制频率与最大速度。\n",
        "en": "Position-loop law v_cmd = Kp*e + Ki*int(e) + Kd*e_dot + Kff*d_est. Includes a dead zone, integral clamping with saturation hold (anti-windup), optional PT1 low-pass on the D term, integral separation, direction-preserving clamping to max_speed, and a per-term breakdown for diagnostics. from_config() reads gains, control rate and max speed from drone_config.yaml.\n"
      },
      "source": [
        {
          "path": "backend/core/feedforward_controller.py",
          "line": 1,
          "end_line": 215
        }
      ],

        {
          "protocol": "rpc",
          "path": "compute",
          "description": {
            "zh": "输入目标位置、当前位置、可选扰动估计与当前速度，返回 (3 维速度指令, 含 P/I/D/ff/saturated 的 info 字典)。\n",
            "en": "Takes target position, current position, optional disturbance estimate and current velocity; returns the 3-D velocity command plus an info dict with P/I/D/ff terms and the saturation flag.\n"
          },
          "key": "rpc:compute"
        },
        {
          "protocol": "rpc",

        "zh": "对标 Betaflight 的信号处理原语：PT1 一阶低通 y[n]=y[n-1]+α(x[n]-y[n-1])，α 由截止频率与采样周期推出，用于抑制 D 项高频噪声；积分分离器在误差超阈值时冻结积分，防积分饱和；另提供对 3 维误差向量的积分分离批处理函数。\n",
        "en": "Betaflight-aligned signal primitives: a PT1 first-order low-pass y[n]=y[n-1]+alpha*(x[n]-y[n-1]) whose alpha derives from cutoff and sample period, used to suppress D-term noise; an integral separator that freezes the I term once the error exceeds a threshold to prevent windup; plus a batch helper applying integral separation to a 3-D error vector.\n"
      },

        "zh": "面向任意 DroneInterface 的指令调度：execute_instant 用反射调用 connect/takeoff/land/emergency/kill/hover/move_to 并回读后端状态（不做动力学 settle，因为真机指令异步）；run_altitude_hold 在 AltitudeHoldDriver 上设定目标高度并步进 settle_s 秒，取稳态均值算误差，并在指令被拒（如 bridge 409 busy）时直接返回 accepted=False，不产出误导性的 settled=True 证据。\n",

        "zh": "离线测试用 Tello 替身：在内存中维护飞行标志、电量、高度、位置与姿态，实现连接/起降/紧急与各路位移指令，并提供电量、高度、姿态、位置与标准化状态字典读接口，使 runtime 与任务层无需真机即可跑通全流程。\n",
        "en": "Tello stand-in for offline testing: keeps flight flag, battery, height, position and attitude in memory, implements connect/takeoff/land/emergency and the per-axis move commands, and exposes battery, height, attitude, position and a normalized state-dict readout so runtime and mission code can run end to end without hardware.\n"
      },

    "seabreeze-inspector.backend.drone.rc-manager": {
      "uid": "e4b7c02a",
      "id": "seabreeze-inspector.backend.drone.rc-manager",

      "tags": [
        "drone",
        "rc",
        "threading"
      ],
      "name": {
        "zh": "RC 速度指令管理器",
        "en": "RC Command Manager"
      },
      "description": {
        "zh": "以独立守护线程 20Hz 持续下发 rc_control 的生命周期管理器：set_command 对 lr/fb/ud/yaw 做 ±100 cm/s 限幅；0.5s 无新指令自动归零（防飞丢）；每 3s 发一次 keepalive 维持连接；stop() 先停线程再补发一次归零指令。mock 模式下只更新状态、不触碰硬件。\n",
        "en": "Lifecycle manager that streams rc_control from a daemon thread at 20 Hz: set_command clamps lr/fb/ud/yaw to +/-100 cm/s, the command auto-zeroes after 0.5 s without an update (anti-flyaway), a keepalive is sent every 3 s, and stop() joins the thread then sends one final zero. In mock mode it only tracks state, never touching hardware.\n"
      },
      "source": [
        {
          "path": "backend/drone/rc_manager.py",
          "line": 19,
          "end_line": 125
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.798Z",

      "apis": [

          "description": {
            "zh": "启动 20Hz RC 发送守护线程（重复调用无副作用）。\n",
            "en": "Starts the 20 Hz RC sender daemon thread (idempotent).\n"
          },
          "key": "rpc:RCManager.start"
        },
        {
          "protocol": "rpc",
          "path": "RCManager.stop",
          "description": {
            "zh": "停止发送线程（最多等 1s）并补发一次全零指令。\n",
            "en": "Stops the sender thread (joining up to 1 s) and sends one final all-zero command.\n"
          },
          "key": "rpc:RCManager.stop"
        },
        {
          "protocol": "rpc",
          "path": "RCManager.set_command",
          "description": {
            "zh": "设置 lr/fb/ud/yaw 速度指令，各轴限幅到 ±100 并刷新超时计时。\n",
            "en": "Sets the lr/fb/ud/yaw velocity command, clamping each axis to +/-100 and refreshing the timeout clock.\n"
          },
          "key": "rpc:RCManager.set_command"
        }

      "name": {
        "zh": "Tello 状态解析",
        "en": "Tello State Parser"
      },
      "description": {
        "zh": "把 djitellopy 的原始状态字典（pitch/roll/yaw/vgx/vgy/vgz/tof/h/bat/baro）规范化为 EKF 可用的量：vg* 由 dm/s ×10 转 cm/s，输出 height(cm)/battery/temperature 与速度向量；velocity_approx 明确标注为速度差分近似而非真实加速度（N12 说明），避免下游误当加速度使用。\n",
        "en": "Normalizes the raw djitellopy state dict (pitch/roll/yaw/vgx/vgy/vgz/tof/h/bat/baro) into EKF-ready quantities: vg* converted from dm/s to cm/s by a factor of 10, plus height (cm), battery, temperature and a velocity vector. velocity_approx is explicitly flagged as a velocity-difference approximation rather than true acceleration (note N12) so downstream code cannot mistake it for one.\n"
      },
      "source": [

      "apis": [

          },

        }

    "seabreeze-inspector.backend.drone.tello-controller": {
      "uid": "7f1d8a36",
      "id": "seabreeze-inspector.backend.drone.tello-controller",

      ],
      "name": {
        "zh": "Tello 状态机控制器",
        "en": "Tello State-Machine Controller"
      },
      "description": {
        "zh": "以 FlightState 枚举（IDLE/CONNECTING/CONNECTED/TAKING_OFF/HOVERING/MOVING/LANDING/EMERGENCY/DISCONNECTED）与 TRANSITIONS 表驱动的 Tello 控制器。connect 经 djitellopy 连接；emergency 改为高空受控高速下降、仅当高度 ≤300cm 才硬停桨（P0-1 修复，kill 单独暴露硬停桨）；move_to 用位移指令执行相对移动；mock=True 时全程不触碰硬件。\n",
        "en": "Tello controller driven by the FlightState enum (IDLE/CONNECTING/CONNECTED/TAKING_OFF/HOVERING/MOVING/LANDING/EMERGENCY/DISCONNECTED) and a TRANSITIONS table. connect goes through djitellopy; emergency now performs a controlled high-speed descent and only cuts the motors below 300 cm (P0-1 fix, with kill exposed separately); move_to issues relative displacement commands; mock=True keeps the whole flow off hardware.\n"
      },
      "source": [
        {
          "path": "backend/drone/tello_basic.py",
          "line": 105,
          "end_line": 294
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.799Z",
      "fingerprint": "3fab0867f0594a02b33e341537fb2018327b78701a617b4dbd5e86e2096570b9",
      "apis": [
        {
          "protocol": "rpc",
          "path": "TelloController.connect",
          "description": {
            "zh": "连接 Tello（mock 时直接成功），失败打印错误并回到 IDLE。\n",
            "en": "Connects to the Tello (immediate success when mocking); on failure it logs the error and returns to IDLE.\n"
          },
          "key": "rpc:TelloController.connect"
        },
        {
          "protocol": "rpc",
          "path": "TelloController.takeoff",
          "description": {
            "zh": "仅在 CONNECTED 状态允许起飞，成功转入 HOVERING，失败转入 EMERGENCY。\n",
            "en": "Allows takeoff only from CONNECTED, moving to HOVERING on success and EMERGENCY on failure.\n"
          },
          "key": "rpc:TelloController.takeoff"
        },
        {
          "protocol": "rpc",
          "path": "TelloController.land",
          "description": {
            "zh": "从 HOVERING/MOVING 降落，失败时触发紧急状态。\n",
            "en": "Lands from HOVERING/MOVING and triggers the emergency path if landing fails.\n"
          },
          "key": "rpc:TelloController.land"
        },
        {
          "protocol": "rpc",
          "path": "TelloController.emergency",
          "description": {
            "zh": "受控紧急降落：高空只做最大速度下降，高度 ≤300cm 才调用 SDK emergency 停桨。\n",
            "en": "Controlled emergency descent: at altitude it only descends at maximum speed and calls the SDK emergency stop below 300 cm.\n"
          },
          "key": "rpc:TelloController.emergency"
        },
        {
          "protocol": "rpc",
          "path": "TelloController.move_to",
          "description": {
            "zh": "按相对位移 (x,y,z) cm 移动，各轴超过 20cm 才下发指令，非飞行状态直接拒绝。\n",
            "en": "Moves by relative (x,y,z) in cm, issuing a command per axis only above 20 cm, and refuses outright when not flying.\n"
          },
          "key": "rpc:TelloController.move_to"
        }
      ],

    "seabreeze-inspector.backend.drone.video-stream": {

      "name": {
        "zh": "Tello 视频流",
        "en": "Tello Video Stream"
      },
      "description": {
        "zh": "生产者-消费者解耦的视频采集：守护线程持续抓帧写入 maxsize=2 的队列（满则丢弃最旧帧以保低延迟），同时在线程锁下更新最新帧缓存；get_frame 非阻塞取帧并清空陈旧帧，队列为空时回落到缓存；附带 1s 窗口的 FPS 统计。mock 模式生成 640×480 随机帧供 UI 联调。\n",
        "en": "Producer-consumer video capture: a daemon thread keeps grabbing frames into a maxsize=2 queue (dropping the oldest frame when full to keep latency low) while updating a lock-protected latest-frame cache. get_frame takes a frame without blocking, drains stale frames and falls back to the cache when the queue is empty, with 1 s-window FPS statistics. Mock mode fabricates 640x480 random frames for UI work.\n"
      },
      "source": [
        {
          "path": "backend/drone/tello_video.py",
          "line": 12,
          "end_line": 106
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.800Z",

      "apis": [

          "path": "TelloVideoStream.start",
          "description": {
            "zh": "启动抓帧守护线程并返回 True。\n",
            "en": "Starts the frame-grabber daemon thread and returns True.\n"
          },
          "key": "rpc:TelloVideoStream.start"
        },
        {
          "protocol": "rpc",
          "path": "TelloVideoStream.get_frame",
          "description": {
            "zh": "非阻塞取最新帧（清空陈旧帧），队列空时返回缓存帧或 None。\n",
            "en": "Non-blocking retrieval of the freshest frame (draining stale ones), returning the cached frame or None when empty.\n"
          },
          "key": "rpc:TelloVideoStream.get_frame"
        },
        {
          "protocol": "rpc",
          "path": "TelloVideoStream.stop",
          "description": {
            "zh": "停止采集并等待线程退出（最多 1s）。\n",
            "en": "Stops capture and joins the thread with a 1 s timeout.\n"
          },
          "key": "rpc:TelloVideoStream.stop"

          "description": {
            "zh": "只读属性：最近 1s 窗口的实测帧率。\n",
            "en": "Read-only property: measured frame rate over the last 1 s window.\n"
          },
          "key": "rpc:TelloVideoStream.fps"
        }
      ],

        "en": "The HAL abstract contracts: DroneInterface (connect/takeoff/land/controlled emergency/kill hard-cut near ground/relative move/hover/battery/height/attitude/state dict/is-flying), ArmInterface (joint angles and end-effector pose) and VisionInterface (detect). Simulation and real hardware implement the same interfaces; the mission layer depends only on abstractions.\n"

      "description": {
        "zh": "接在 EKF 之前的可信位置来源：统一观测契约（位置 cm/z-up + 单调时钟时间戳 + 0..1 质量分 + 有效期/质量阈值），以及真实 ArUco 解算与注入式真值两种实现。没有可用观测时一律返回 None —— 绝不返回占位坐标。真机上它是导航/巡检/返航闸门的唯一依据。\n",
        "en": "Trusted position sources feeding the EKF: one observation contract (cm/z-up position, monotonic timestamp, 0..1 quality, max-age/quality thresholds) plus real ArUco solving and an injected ground-truth implementation. No usable observation means None — never a placeholder position. On hardware it is the only basis for navigate/inspect/return gates.\n"

    "seabreeze-inspector.backend.localization.aruco-source": {
      "uid": "c3d4e5f6",
      "id": "seabreeze-inspector.backend.localization.aruco-source",
      "parent": "seabreeze-inspector.backend.localization",
      "tree": "seabreeze-inspector",
      "depth": 4,
      "tags": [
        "localization",
        "aruco",
        "vision"
      ],
      "name": {
        "zh": "ArUco 视觉定位源",
        "en": "ArUco Vision Localization"
      },
      "description": {
        "zh": "真实 ArUco 定位：检测标记 → solvePnP 解位姿 → 世界坐标（cm，z-up），质量分 = exp(-重投影误差/3.0) × min(1, 标记数/2)，依据是实测残差而非估计。被动推帧式：由主循环每帧把视频帧推进来（read_frame），未检出/解算失败/内参未标定一律返回 None。实测单标记误差 1.867cm、双标记 1.478cm。\n",
        "en": "Real ArUco localization: detect markers, solvePnP, then world coordinates (cm, z-up) with quality = exp(-reprojection error/3.0) x min(1, markers/2), grounded in measured residuals. Passively frame-driven: the main loop pushes each frame via read_frame; no detection, failed solve or uncalibrated intrinsics all yield None. Measured error: 1.867 cm single marker, 1.478 cm two markers.\n"
      },

    "seabreeze-inspector.backend.localization.base": {
      "uid": "b2c3d4e5",
      "id": "seabreeze-inspector.backend.localization.base",

      "tags": [

      ],
      "name": {
        "zh": "观测契约与可用性判定",
        "en": "Observation Contract & Usability"
      },
      "description": {
        "zh": "外部定位的统一契约与判定：LocalizationObservation（位置/时间戳/质量/来源，只规范化不抛异常）与 LocalizationSource 抽象基类；is_finite/is_usable/age 三个判定把维度错误、nan/inf、质量不足与过期统一收口为\"不可用\"，让\"坏观测\"与\"没有观测\"在类型上可区分。阈值 MAX_AGE_S=0.3、MIN_QUALITY=0.3 依据实测残差给出。\n",
        "en": "The localization contract: LocalizationObservation (position/timestamp/quality/source, normalising rather than raising) and the LocalizationSource ABC; is_finite/is_usable/age collapse bad dimensions, nan/inf, low quality and staleness into \"unusable\", keeping \"bad observation\" distinct from \"no observation\". Thresholds MAX_AGE_S=0.3 and MIN_QUALITY=0.3 come from measured residuals.\n"
      },
      "source": [
        {
          "path": "backend/localization/base.py",
          "line": 1,
          "end_line": 103
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:32:18.248Z",
      "fingerprint": "e157d48976342e08c3dbb1e1969fa8d0ab494443fc9aed6fa2ace26e077ca855",
      "apis": [
        {
          "protocol": "rpc",
          "path": "LocalizationObservation.is_usable",
          "description": {
            "zh": "维度/有限性 + 质量分 + 有效期三者全过才算可用。\n",
            "en": "Usable only when dimensions/finiteness, quality and age all pass.\n"
          },
          "key": "rpc:LocalizationObservation.is_usable"
        },
        {
          "protocol": "rpc",
          "path": "LocalizationObservation.age",
          "description": {
            "zh": "观测年龄（秒），未来时间戳会给出负值从而被判不可用。\n",
            "en": "Observation age in seconds; future timestamps go negative and are rejected.\n"
          },
          "key": "rpc:LocalizationObservation.age"
        },
        {
          "protocol": "rpc",
          "path": "LocalizationSource.read",
          "description": {
            "zh": "读一次观测；无可用观测返回 None（禁止占位坐标）。\n",
            "en": "Reads one observation, returning None when unusable (no placeholder positions).\n"
          },
          "key": "rpc:LocalizationSource.read"
        }
      ],

        "en": "Three-tier safety monitoring: judges OK/WARN/LAND/KILL from battery, attitude, height and heartbeat timeout (priority KILL > LAND > WARN) with configurable thresholds. Provides heartbeat, recoverability check and manual reset, so a low-battery trip no longer locks the vehicle permanently.\n"
      },

        "en": "HTTP driver for the OmniSim Mavic bridge: POST /action issues takeoff with wait=true and distinguishes 409 busy from a fault, GET /state polls z and mode; settle averages the last five seconds and states that n_steps counts polls, not physics steps; missing z is skipped rather than silently averaged as zero.\n"
      },

    "seabreeze-inspector.backend.simulation.drone-adapter": {

      "id": "seabreeze-inspector.backend.simulation.drone-adapter",
      "parent": "seabreeze-inspector.backend.simulation",
      "tree": "seabreeze-inspector",
      "depth": 4,
      "tags": [
        "hal",
        "adapter",
        "simulation"
      ],
      "name": {
        "zh": "仿真无人机适配器",
        "en": "Sim Drone Adapter"
      },
      "description": {
        "zh": "把 Quadrotor3D 适配成 DroneInterface：起降/紧急为延迟语义（保持 is_flying 直到 SimRuntime 探到触地再 mark_landed），move_to 按 cm 偏移设置目标，hover 清零速度，姿态从弧度转度；另提供电量设置与目标位姿查询。\n",
        "en": "Adapts Quadrotor3D to DroneInterface: land/emergency use deferred semantics (is_flying stays true until SimRuntime sees touchdown and calls mark_landed), move_to sets the target from a cm offset, hover zeroes velocity and attitude converts radians to degrees; also exposes battery set and target queries.\n"
      },
      "source": [
        {
          "path": "backend/simulation/drone_adapter.py",
          "line": 13,
          "end_line": 130
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:31:10.807Z",
      "fingerprint": "4ec499d6d839de295b55be7a74d505e049ed0baf5488d6595e1fe33ffd271252",
      "apis": [
        {
          "protocol": "rpc",
          "path": "SimDroneAdapter.takeoff",
          "description": {
            "zh": "起飞：置 is_flying 并把目标高度设为 1.2m。\n",
            "en": "Takes off: sets is_flying and targets a 1.2 m hover height.\n"
          },
          "key": "rpc:SimDroneAdapter.takeoff"
        },
        {
          "protocol": "rpc",
          "path": "SimDroneAdapter.land",
          "description": {
            "zh": "请求降落（延迟语义：等 SimRuntime 判定触地后才置 is_flying=False）。\n",
            "en": "Requests landing with deferred semantics: is_flying clears only after SimRuntime detects touchdown.\n"
          },
          "key": "rpc:SimDroneAdapter.land"
        },
        {
          "protocol": "rpc",
          "path": "SimDroneAdapter.emergency",
          "description": {
            "zh": "请求受控紧急下降（不清零速度，交给级联控制驱动物理下降）。\n",
            "en": "Requests a controlled emergency descent, leaving velocity to the cascaded controller.\n"
          },
          "key": "rpc:SimDroneAdapter.emergency"
        },
        {
          "protocol": "rpc",
          "path": "SimDroneAdapter.mark_landed",
          "description": {
            "zh": "物理触地回调：清 flying/landing/emergency 标志，让 mc 能回到 IDLE。\n",
            "en": "Touchdown callback: clears the flying, landing and emergency flags so mc can return to IDLE.\n"
          },
          "key": "rpc:SimDroneAdapter.mark_landed"
        },
        {
          "protocol": "rpc",
          "path": "SimDroneAdapter.move_to",
          "description": {
            "zh": "按 cm 相对偏移设置仿真目标位置。\n",
            "en": "Sets the simulated target position from a centimetre relative offset.\n"
          },
          "key": "rpc:SimDroneAdapter.move_to"
        }
      ],

      "id": "seabreeze-inspector.backend.simulation.transport-model",
      "parent": "seabreeze-inspector.backend.simulation",
      "tree": "seabreeze-inspector",
      "depth": 4,
      "tags": [
        "simulation",
        "fidelity",
        "transport"
      ],
      "name": {
        "zh": "传输层保真度模型",
        "en": "Transport Fidelity Model"
      },
      "description": {
        "zh": "把\"理想链路\"补成现实链路：传感器离散延迟线（样本带采样时刻，可查测量年龄）/ 可复现丢包（i.i.d. 伯努利或 Gilbert-Elliott 突发，两状态马尔可夫）/ 上行指令链路（延迟+丢包+冷启动语义）/ 执行器一阶惯性（PT1 解析解，非欧拉）。默认全 0 时严格直通、逐位不变。丢包序列同 seed 可复现，且只在\"真有包到期\"时掷骰。\n",
        "en": "Turns an ideal link into a realistic one: a discrete sensor delay line carrying sample timestamps (so measurement age is queryable), reproducible loss (i.i.d. Bernoulli or Gilbert-Elliott burst), an uplink command path (delay + loss + cold-start semantics) and first-order actuator lag (analytic PT1, not Euler). All defaults are strict pass-through, bit-identical. Loss sequences are seed-reproducible and only consume randomness when a packet is actually due.\n"
      },
      "source": [
        {
          "path": "backend/simulation/transport_model.py",
          "line": 1,
          "end_line": 335
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",
      "updated_at": "2026-09-30T13:32:18.250Z",
      "fingerprint": "e413fc62faa90cc5ead7e68e58ff4fd9bdf317c2a00cbc9d09b14e9d124070cf",
      "apis": [
        {
          "protocol": "rpc",
          "path": "SensorTransportModel.push",
          "description": {
            "zh": "送一帧样本入延迟线，并记录其采样时刻。\n",
            "en": "Pushes one sample into the delay line and records its sampling instant.\n"
          },
          "key": "rpc:SensorTransportModel.push"
        },
        {
          "protocol": "rpc",
          "path": "SensorTransportModel.poll",
          "description": {
            "zh": "取出当前应交付的样本；未到期或丢包返回 None。\n",
            "en": "Returns the sample due now, or None when not due or dropped.\n"
          },
          "key": "rpc:SensorTransportModel.poll"
        },
        {
          "protocol": "rpc",
          "path": "SensorTransportModel.last_age",
          "description": {
            "zh": "手上这条测量有多旧（EKF 据此膨胀 R）。\n",
            "en": "Age of the measurement in hand, used by the EKF to inflate R.\n"
          },
          "key": "rpc:SensorTransportModel.last_age"
        },
        {
          "protocol": "rpc",
          "path": "CommandTransportModel.poll",
          "description": {
            "zh": "返回已到达机体的最新指令；丢包不覆盖上一条。\n",
            "en": "Returns the latest command that reached the vehicle; drops never overwrite the previous one.\n"
          },
          "key": "rpc:CommandTransportModel.poll"
        },
        {
          "protocol": "rpc",
          "path": "ActuatorLag.update",
          "description": {
            "zh": "一阶惯性推进一步（tau\u003c=0 时严格直通）。\n",
            "en": "Advances first-order lag by one step (strict pass-through when tau\u003c=0).\n"
          },
          "key": "rpc:ActuatorLag.update"
        }
      ],

    "seabreeze-inspector.backend.utils.message-bus": {
      "uid": "1b9d4e27",
      "id": "seabreeze-inspector.backend.utils.message-bus",

      "tags": [
        "bus",

        "threading"
      ],
      "name": {
        "zh": "发布订阅消息总线",
        "en": "Pub-Sub Message Bus"
      },
      "description": {
        "zh": "全系统唯一的进程内消息总线。每个 topic 维护独立订阅队列（满时丢弃最旧），publish 一次性扇出到全部订阅者并返回投递数；订阅者用 read_latest 非阻塞取最新一帧，无 dispatch 线程。同时登记 drone/arm/ekf/vision/safety/mission/log 全部 topic 常量。\n",
        "en": "The only in-process message bus in the system. Each topic keeps its own subscriber queue (oldest dropped when full); publish fans out once to every subscriber and returns the delivered count; subscribers poll non-blockingly with read_latest and there is no dispatch thread. Also holds every drone/arm/ekf/vision/safety/mission/log topic constant.\n"
      },
      "source": [
        {
          "path": "backend/utils/bus.py",
          "line": 28,
          "end_line": 158
        }
      ],
      "revision": "285c4b39b3388eefcfbc68832a115017c3159ef2",

          },
          "key": "rpc:MessageBus.publish"
        },
        {
          "protocol": "rpc",
          "path": "MessageBus.subscribe",
          "description": {
            "zh": "订阅 topic，返回独立 Subscription 句柄（每订阅者独立队列）。\n",
            "en": "Subscribes to a topic and returns an independent Subscription handle.\n"
          },
          "key": "rpc:MessageBus.subscribe"
        },
        {
          "protocol": "rpc",
          "path": "MessageBus.unsubscribe",
          "description": {
            "zh": "取消订阅，从该 topic 的订阅者列表移除句柄。\n",
            "en": "Unsubscribes, removing the handle from that topic's subscriber list.\n"

        "en": "YOLO Defect Detector"
      },
      "description": {
        "zh": "叶片缺陷检测推理：类别 0=crack / 1=corrosion / 2=leading_edge_damage，并把旧数据集的 erosion/rust 别名归一为 corrosion；参数缺省时从 yolo_config.yaml 读取权重路径、置信度与设备。detect 对空帧直接返回，推理或结果解析抛异常时打印 traceback 并自动降级到 mock 检测，保证主循环不断。输出含 class_id/class_name/confidence/bbox/severity。\n",
        "en": "Blade defect inference: classes 0=crack, 1=corrosion, 2=leading_edge_damage with legacy erosion/rust aliases normalized to corrosion; weights path, confidence and device default from yolo_config.yaml. detect returns immediately on empty frames, and on inference or parsing errors prints a traceback and degrades to mock detection so the main loop never dies. Outputs class_id/class_name/confidence/bbox/severity.\n"
      },

    "seabreeze-inspector.tooling.release-verifiers": {

        "en": "Release Verifiers"
      },
      "description": {
        "zh": "把\"什么算发布一致\"拆成三个职责单一的校验器加一个总入口：模型（权重存在 + SHA256 + 字节数；release_candidate=true 必须有完整 training/eval provenance）、数据集（内容摘要与派生版本）、环境（只校声明的 Python 协议范围与 requirements 指纹）。权威=内容指纹；mtime/绝对路径/平台/补丁号被显式忽略并打印，这修掉了干净克隆必然失败的根因。\n",
        "en": "Three single-purpose verifiers behind one entry: models (presence, SHA256, byte count; release candidates must carry full provenance), datasets (content digest and derived version) and environment (declared Python range plus requirements fingerprint). Authority is the content fingerprint; mtime, paths, platform and patch versions are ignored and printed - the root cause of clean-clone failure.\n"
      },

<script>
(function () {
  'use strict'
  var DATA = JSON.parse(document.getElementById('normify-data').textContent)
  var mods = DATA.modules
  var apiIndex = DATA.api_index
  var edges = DATA.edges
  var stats = DATA.project.stats
  var trees = DATA.project.trees
  var lang = initLang()
  var current = parseHash()
  var children = {}
  var roots = []
  Object.keys(mods).forEach(function (id) {
    var m = mods[id]
    if (m.parent === null) roots.push(id)
    else (children[m.parent] = children[m.parent] || []).push(id)
  })
  roots.sort()
  Object.keys(children).forEach(function (k) { children[k].sort() })
  var depIn = {}
  edges.forEach(function (e) { (depIn[e.to] = depIn[e.to] || []).push(e) })
  var corpus = buildCorpus()

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
  function L(o) { if (!o) return ''; return o[lang] || o.zh || '' }
  function treeRepo(treeId) { for (var i = 0; i < trees.length; i++) if (trees[i].tree_id === treeId) return trees[i].repository || null; return null }
  function idOfSegs(segs) { return segs.join('.') }
  function sourceHref(m) {
    var repo = treeRepo(m.tree)
    if (!repo || !m.source || m.source.length === 0) return null
    var s = m.source[0]
    var href = repo.replace(/\/$/, '') + '/blob/' + m.revision + '/' + s.path
    if (s.line) href += '#L' + s.line + (s.end_line && s.end_line !== s.line ? '-L' + s.end_line : '')
    return href
  }
  function initLang() {
    var p = new URLSearchParams(location.search).get('lang')
    if (p === 'zh' || p === 'en') return p
    try { var s = localStorage.getItem('normify-lang'); if (s === 'zh' || s === 'en') return s } catch (e) {}
    return (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'
  }
  function initTheme() {
    var p = new URLSearchParams(location.search).get('theme')
    var t = null
    try { t = localStorage.getItem('normify-theme') } catch (e) {}
    if (p === 'dark' || p === 'light') t = p
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
  }
  function parseHash() {
    var h = location.hash.replace(/^#/, '')
    if (h === 'trees') return { view: 'trees' }
    var params = {}
    h.split('&').forEach(function (kv) {
      if (!kv) return
      var i = kv.indexOf('=')
      if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1))
    })
    if (params.view === 'outline') return { view: 'outline' }
    if (params.view === 'apis') return { view: 'apis' }
    if (params.api) {
      var owner = apiIndex[params.api]
      if (owner) return { view: 'level', moduleId: owner, apiKey: params.api }
    }
    if (params.module && mods[params.module]) return { view: 'level', moduleId: params.module }
    if (params.tree && mods[params.tree]) return { view: 'level', moduleId: params.tree }
    return { view: 'trees' }
  }
  function buildCorpus() {
    var out = []
    Object.keys(mods).forEach(function (id) {
      var m = mods[id]
      out.push({ kind: 'module', id: id, text: (id + ' ' + m.name.zh + ' ' + m.name.en + ' ' + L(m.description)).toLowerCase() })
    })
    Object.keys(apiIndex).forEach(function (key) {
      out.push({ kind: 'api', id: key, moduleId: apiIndex[key], text: key.toLowerCase() })
    })
    return out
  }

  function goto(hash) { location.hash = hash }
  function render() {
    var main = document.getElementById('main')
    main.innerHTML = ''
    renderBreadcrumb()
    document.getElementById('btnLang').textContent = lang === 'zh' ? 'EN' : '中'
    if (current.view === 'trees') renderTrees(main)
    else if (current.view === 'level') renderLevel(main)
    else if (current.view === 'outline') renderOutline(main)
    else renderApis(main)
    var footer = document.getElementById('footer')
    footer.textContent = 'Normify · ' + DATA.project.name + ' · 模块 ' + stats.module_count + ' / API ' + stats.api_count + ' / 箭头 ' + stats.dep_count + ' · 构建于 ' + DATA.project.compiled_at
    if (current.apiKey) highlightApi()
  }
  function renderBreadcrumb() {
    var bc = document.getElementById('breadcrumb')
    bc.innerHTML = ''
    var a
    if (roots.length > 1) {
      a = document.createElement('a')
      a.href = '#trees'
      a.textContent = '树'
      bc.appendChild(a)
      bc.appendChild(sepEl())
    }
    if (current.moduleId) {
      var segs = current.moduleId.split('.')
      for (var i = 0; i < segs.length; i++) {
        a = document.createElement('a')
        a.href = '#module=' + encodeURIComponent(idOfSegs(segs.slice(0, i + 1)))
        a.textContent = segs[i]
        bc.appendChild(a)
        if (i < segs.length - 1) bc.appendChild(sepEl())
      }
    }
  }
  function sepEl() { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; return s }

  function renderTrees(main) {
    var wrap = el('div', 'trees')
    roots.forEach(function (id) {
      var m = mods[id]
      var card = el('div', 'tree-card')
      card.innerHTML = '<h2>' + esc(L(m.name)) + '</h2><div class="hint">' + esc(m.id) + '</div><div class="repo">' + esc(treeRepo(m.id) || '') + '</div><div class="hint">' + esc(oneLine(L(m.description), 120)) + '</div>'
      card.onclick = function () { goto('#module=' + encodeURIComponent(id)) }
      card.onmouseenter = function () { showTip(card, m) }
      card.onmouseleave = hideTip
      wrap.appendChild(card)
    })
    main.appendChild(wrap)
  }

  function renderLevel(main) {
    var m = mods[current.moduleId]
    var head = el('div', 'level-head')
    var repo = treeRepo(m.tree)
    var srcHref = sourceHref(m)
    head.innerHTML = '<h1>' + esc(L(m.name)) + ' <span class="hint">' + esc(m.id) + '</span></h1>'
      + '<p class="desc">' + esc(L(m.description)) + '</p>'
      + '<div class="meta">' + (m.state ? '<span>状态 ' + (m.state === 'planned' ? '计划' : m.state === 'deprecated' ? '废弃' : '已实现') + '</span>' : '') + '<span>模块 ' + (m.aggregate.descendant_count + 1) + '</span><span>API ' + (m.aggregate.own_api_count + m.aggregate.inherited_api_count) + '</span><span>出边 ' + m.aggregate.dep_out + '</span><span>入边 ' + m.aggregate.dep_in + '</span><span>' + ((DATA.layouts && DATA.layouts[current.moduleId]) ? '布局 渲染数据' : '布局 自动') + '</span>'
      + (repo ? '<a href="' + esc(repo) + '" target="_blank" rel="noopener">仓库</a>' : '')
      + (srcHref ? '<a href="' + esc(srcHref) + '" target="_blank" rel="noopener">源码 ' + esc(m.source[0].path) + '</a>' : '')
      + '</div>'
    main.appendChild(head)
    var kids = children[current.moduleId] || []
    if (kids.length === 0) {
      renderLeafDetail(main, m)
    } else {
      renderDiagram(main, m, kids)
      renderCrossEdges(main, m, kids)
      renderInheritedApis(main, m)
    }
  }

  function estWidth(s, fs) {
    var w = 0
    for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 255 ? fs : fs * 0.56
    return w
  }

  function wrapName(name, maxW, fs) {
    var s = String(name).replace(/s+/g, ' ')
    var words = s.split(' ')
    var lines = []
    if (words.length > 1) {
      var cur = ''
      for (var i = 0; i < words.length; i++) {
        var t = cur === '' ? words[i] : cur + ' ' + words[i]
        if (estWidth(t, fs) <= maxW || cur === '') cur = t
        else { lines.push(cur); cur = words[i] }
      }
      lines.push(cur)
    } else {
      lines.push(s)
    }
    if (lines.length > 2) lines = [lines[0], lines.slice(1).join(' ')]
    if (lines.length === 1 && estWidth(lines[0], fs) > maxW) {
      var l = lines[0], cut = 1
      while (cut < l.length && estWidth(l.slice(0, cut), fs) <= maxW) cut++
      cut = Math.max(1, cut - 1)
      lines = [l.slice(0, cut), l.slice(cut)]
    }
    if (lines.length === 2 && estWidth(lines[0], fs) > maxW) {
      var l2 = lines[0], cut2 = 1
      while (cut2 < l2.length && estWidth(l2.slice(0, cut2), fs) <= maxW) cut2++
      cut2 = Math.max(1, cut2 - 1)
      lines = [l2.slice(0, cut2), l2.slice(cut2) + ' ' + lines[1]]
    }
    return lines
  }

  function fitName(name, maxW) {
    var best = null
    for (var fs = 13; fs >= 8.5; fs -= 0.5) {
      var lines = wrapName(name, maxW, fs)
      var ok = true
      for (var i = 0; i < lines.length; i++) if (estWidth(lines[i], fs) > maxW) ok = false
      best = { lines: lines, fs: fs }
      if (ok) break
    }
    for (var j = 0; j < best.lines.length; j++) {
      var ln = best.lines[j]
      if (estWidth(ln, best.fs) <= maxW) continue
      while (ln.length > 1 && estWidth(ln + '…', best.fs) > maxW) ln = ln.slice(0, -1)
      best.lines[j] = ln + '…'
    }
    return best
  }

  var BOX = 200, GX = 220, GY = 220, MARGIN = 56, GPAD = 22, GTITLE = 24

  function orderedKids(kids, lay) {
    var kidSet = {}
    kids.forEach(function (k) { kidSet[k] = true })
    var edges = directEdges(kids)
    var order = []
    var seen = {}
    if (lay && lay.order) lay.order.forEach(function (id) { if (kidSet[id] && !seen[id]) { seen[id] = true; order.push(id) } })
    var rest = kids.filter(function (id) { return !seen[id] })
    if (edges.length > 0) {
      var layer = layerize(kids, edges)
      rest.sort(function (a, b) { return (layer[a] - layer[b]) || (a < b ? -1 : a > b ? 1 : 0) })
    } else {
      rest.sort()
    }
    return order.concat(rest)
  }

  /** 当前层可见的模块级直连边（仅用于自动排序/分层）。 */
  function directEdges(kids) {
    var kidSet = {}
    kids.forEach(function (k) { kidSet[k] = true })
    var out = []
    kids.forEach(function (id) {
      ;(mods[id].deps || []).forEach(function (d) {
        if (kidSet[d.to] && d.to !== id) out.push({ from: id, to: d.to, kind: d.kind })
      })
    })
    return out
  }

  /**
   * 当前层要画的全部边（对齐"API 直接连线"的原始目标）：
   * - exact：两端都在本层（孩子）——用真实 from_api/to_api 锚点，一条不合并；
   * - agg：某一端在可见孩子的子树内部（跨层）——聚合到可见模块上，虚线 + ×N + 明细 tooltip。
   */
  function collectEdges(kids) {
    var kidSet = {}
    kids.forEach(function (k) { kidSet[k] = true })
    var visibleOf = function (id) {
      if (kidSet[id]) return id

        var dx = p1.x - p0.x, dy = p1.y - p0.y
        var len = Math.sqrt(dx * dx + dy * dy)
        if (len < 30) continue
        var horiz = Math.abs(dx) > Math.abs(dy)
        var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2
        var lx = mx - w / 2 - 4, ly = horiz ? my - 14 : my - 5, lw = w + 8, lh = 12
        var ok = true
        for (var r = 0; r < rects.length; r++) {
          var n = nodes[r]
          if (n.id === skipFrom || n.id === skipTo) continue
          var b2 = rects[r]
          if (lx + lw > b2.x + 3 && lx < b2.x + b2.w - 3 && ly + lh > b2.y + 3 && ly < b2.y + b2.h - 3) { ok = false; break }
        }
        for (var pl = 0; pl < placedLabels.length; pl++) {
          var b3 = placedLabels[pl]
          if (lx + lw > b3.x && lx < b3.x + b3.w && ly + lh > b3.y && ly < b3.y + b3.h) { ok = false; break }
        }
        if (ok && len > bestLen) { bestLen = len; best = { x: mx, y: horiz ? my - 9 : my, len: len, rect: { x: lx, y: ly, w: lw, h: lh } } }
      }
      if (best !== null && best.rect !== undefined) placedLabels.push(best.rect)
      return best
    }
    function drawEdge(e, pa, pb, r) {
      var pts = r.pts
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      path.setAttribute('d', roundedPath(pts, (r.hint && r.hint.style === 'curve') || e.agg ? 16 : 10))
      path.setAttribute('class', 'edge kind-' + (e.kind || 'reference') + (e.cross_tree ? ' cross' : '') + (e.agg ? ' agg' : ''))
      path.setAttribute('data-from', e.from)
      path.setAttribute('data-to', e.to)
      var tip = pts[pts.length - 1], prev = pts[pts.length - 2] || pa
      var entry = { path: path, arrow: mk, label: null, from: e.from, to: e.to }
      var title = document.createElementNS('http://www.w3.org/2000/svg', 'title')
      title.textContent = e.agg
        ? '聚合 ' + e.count + ' 条依赖：\n' + e.samples.join('\n')
        : e.from + (e.from_api ? ' [' + e.from_api + ']' : '') + ' -> ' + e.to + (e.to_api ? ' [' + e.to_api + ']' : '') + ' (' + e.kind + ')'
      path.appendChild(title)
      svg.appendChild(path)
      var mk = document.createElementNS('http://www.w3.org/2000/svg', 'polygon')
      mk.setAttribute('points', arrowPoints(tip, prev))
      mk.setAttribute('class', 'arrow kind-' + (e.kind || 'reference') + (e.cross_tree ? ' cross' : '') + (e.agg ? ' agg' : ''))
      svg.appendChild(mk)
      var text = e.agg ? ('×' + e.count) : (e.label ? L(e.label) : e.kind)
      var budget = labelBudget[text] || 0
      var lp = budget < 2 ? labelPos(pts, text, e.from, e.to) : null
      if (lp) {
        labelBudget[text] = budget + 1
        var t = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        t.setAttribute('x', lp.x)
        t.setAttribute('y', lp.y)
        t.setAttribute('text-anchor', 'middle')
        t.setAttribute('class', 'edge-label' + (e.agg ? ' agg' : ''))
        t.setAttribute('style', 'paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round;')
        t.textContent = text
        svg.appendChild(t)
        entry.label = t
        extend(lp.x - 30, lp.y - 10)
        extend(lp.x + 30, lp.y + 12)
      }
      for (var i = 0; i < pts.length; i++) extend(pts[i].x, pts[i].y)
      commitRoute(pts)
      drawn.push(entry)
    }

    // 先画精确边（API 直连，优先占用干净通道），再画聚合边（虚线、更轻）
    exactEdges.forEach(function (e) {
      var A = byId[e.from], B = byId[e.to]
      if (!A || !B) return
      var pa = portOf(A, e.sides[0], e.from + e.sides[0], e.from_api)
      var pb = portOf(B, e.sides[1], e.to + e.sides[1], e.to_api)
      drawEdge(e, pa, pb, route(e, pa, pb))
    })
    aggEdges.forEach(function (e) {
      var A = byId[e.from], B = byId[e.to]
      if (!A || !B) return
      var pa = portOf(A, e.sides[0], e.from + e.sides[0], null)
      var pb = portOf(B, e.sides[1], e.to + e.sides[1], null)
      drawEdge(e, pa, pb, route(e, pa, pb))
    })

    var nodeGroups = []
    nodes.forEach(function (n) {
      var km = mods[n.id]
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g')
      g.setAttribute('class', 'node-g')
      g.setAttribute('data-id', n.id)
      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
      rect.setAttribute('x', n.x); rect.setAttribute('y', n.y)
      rect.setAttribute('width', n.w); rect.setAttribute('height', n.h)
      rect.setAttribute('rx', 9)
      rect.setAttribute('data-id', n.id)
      rect.setAttribute('class', 'node' + (children[n.id] ? '' : ' leaf') + (km.state ? ' state-' + km.state : ''))
      g.appendChild(rect)
      var rows = apiRows(n.id)
      var nameH = rows.length > 0 ? 36 : n.h
      var fit = fitName(L(km.name), n.w - 14)
      var lh = fit.fs * 1.28
      var y0 = n.y + nameH / 2 - (fit.lines.length - 1) * lh / 2
      for (var li = 0; li < fit.lines.length; li++) {
        var t = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        t.setAttribute('x', n.cx)
        t.setAttribute('y', y0 + li * lh)
        t.setAttribute('font-size', fit.fs)
        t.setAttribute('text-anchor', 'middle')
        t.setAttribute('dominant-baseline', 'middle')
        t.setAttribute('class', 'node-name')
        t.textContent = fit.lines[li]
        g.appendChild(t)
      }
      if (rows.length > 0) {
        var sep = document.createElementNS('http://www.w3.org/2000/svg', 'line')
        sep.setAttribute('x1', n.x + 8); sep.setAttribute('x2', n.x + n.w - 8)
        sep.setAttribute('y1', n.y + 36); sep.setAttribute('y2', n.y + 36)
        sep.setAttribute('class', 'api-sep')
        g.appendChild(sep)
        rows.forEach(function (a, ai) {
          var at = document.createElementNS('http://www.w3.org/2000/svg', 'text')
          at.setAttribute('x', n.x + 9)
          at.setAttribute('y', n.y + 36 + ai * 13 + 9)
          at.setAttribute('class', 'api-chip')
          at.textContent = clipText(String(a.key || a.protocol + ':' + a.path), n.w - 24, 9)
          g.appendChild(at)
        })
        var total = (km.apis || []).length
        if (total > rows.length) {
          var more = document.createElementNS('http://www.w3.org/2000/svg', 'text')
          more.setAttribute('x', n.x + n.w - 9)
          more.setAttribute('y', n.y + n.h - 4)
          more.setAttribute('text-anchor', 'end')
          more.setAttribute('class', 'api-more')
          more.textContent = '+' + (total - rows.length)
          g.appendChild(more)
        }
      }
      if (km.state === 'planned' || km.state === 'deprecated') {
        var badge = document.createElementNS('http://www.w3.org/2000/svg', 'text')
        badge.setAttribute('x', n.x + n.w - 6)
        badge.setAttribute('y', n.y + 12)
        badge.setAttribute('text-anchor', 'end')
        badge.setAttribute('class', 'state-badge state-' + km.state)
        badge.textContent = km.state === 'planned' ? (lang === 'zh' ? '计划' : 'planned') : (lang === 'zh' ? '废弃' : 'deprecated')
        g.appendChild(badge)
      }
      g.onclick = function () { goto('#module=' + encodeURIComponent(n.id)) }
      g.onmouseenter = function () {
        showTip(g, km)
        drawn.forEach(function (d) {
          var hit = d.from === n.id || d.to === n.id
          ;[d.path, d.arrow].forEach(function (el2) { el2.classList.toggle('hl', hit); el2.classList.toggle('dim', !hit) })
          if (d.label) d.label.classList.toggle('dim', !hit)
        })
      }
      g.onmouseleave = function () {
        hideTip()
        drawn.forEach(function (d) {
          ;[d.path, d.arrow].forEach(function (el2) { el2.classList.remove('hl'); el2.classList.remove('dim') })
          if (d.label) d.label.classList.remove('dim')
        })
      }
      svg.appendChild(g)
      nodeGroups.push(g)
      extend(n.x, n.y)
      extend(n.x + n.w, n.y + n.h)
    })

    var PADB = 28
    var vbW = Math.max(320, bounds.maxX - bounds.minX + PADB * 2)
    var vbH = Math.max(240, bounds.maxY - bounds.minY + PADB * 2)
    svg.setAttribute('viewBox', (bounds.minX - PADB) + ' ' + (bounds.minY - PADB) + ' ' + vbW + ' ' + vbH)
    svg.setAttribute('width', vbW)
    svg.setAttribute('height', vbH)

    var wrap = el('div', 'diagram-wrap')
    wrap.appendChild(svg)
    main.appendChild(wrap)

    var zoomSteps = [0, 1, 1.5, 2, 3]
    var zi = (vbW > wrap.clientWidth + 20) ? 1 : 0
    var ziLabel = el('span', 'zoom-label')
    function applyZoom() {
      var s = zoomSteps[zi]
      if (s === 0) { svg.style.width = '100%'; svg.style.maxWidth = '100%' } else { svg.style.width = Math.round(vbW * s) + 'px'; svg.style.maxWidth = 'none' }
      svg.style.height = 'auto'
      ziLabel.textContent = s === 0 ? (lang === 'zh' ? '适应' : 'Fit') : Math.round(s * 100) + '%'
    }
    var tools = el('div', 'diagram-tools')
    var minus = el('button', 'zoom-btn', '−')
    minus.onclick = function () { zi = Math.max(0, zi - 1); applyZoom() }
    var fitBtn = el('button', 'zoom-btn', lang === 'zh' ? '适应' : 'Fit')
    fitBtn.onclick = function () { zi = 0; applyZoom() }
    var plus = el('button', 'zoom-btn', '+')
    plus.onclick = function () { zi = Math.min(zoomSteps.length - 1, zi + 1); applyZoom() }
    tools.appendChild(minus); tools.appendChild(fitBtn); tools.appendChild(plus); tools.appendChild(ziLabel)
    if (aggEdges.length > 0) {
      var aggBtn = el('button', 'zoom-btn' + ' agg-toggle', (lang === 'zh' ? '显示跨层聚合 ×' + aggEdges.length : 'Show ' + aggEdges.length + ' cross-level')) 
      aggBtn.onclick = function () {
        var hidden = svg.classList.toggle('hide-agg')
        aggBtn.classList.toggle('on', !hidden)
      }
      if (!/[?&]agg=1/.test(location.search)) svg.classList.add('hide-agg')
      tools.appendChild(aggBtn)
      var aggInfo = el('span', 'hint', lang === 'zh' ? '（虚线 = 跨层聚合 ×N，默认隐藏，可点左侧按钮显示；悬停看明细）' : '(dashed = cross-level aggregate; hidden by default)')
      tools.appendChild(aggInfo)
    }
    main.appendChild(tools)
    applyZoom()

    var bar = el('div', 'legendbar')
    bar.innerHTML = '<span class="hint">连线：</span>'
      + '<span class="chip"><span class="swatch kind-call"></span>call</span>'
      + '<span class="chip"><span class="swatch kind-event"></span>event</span>'
      + '<span class="chip"><span class="swatch kind-dataflow"></span>dataflow</span>'
      + '<span class="chip"><span class="swatch kind-reference"></span>reference</span>'
      + '<span class="chip"><span class="swatch cross"></span>跨树</span>'
      + '<span class="chip"><span class="swatch agg"></span>' + esc(lang === 'zh' ? '跨层聚合' : 'aggregate') + '</span>'
      + '<span class="chip">' + esc(lang === 'zh' ? '悬停模块可高亮其连线；虚线边悬停可看明细' : 'Hover a module to highlight its edges; hover dashed edges for details') + '</span>'
      + '<span class="chip"><span class="swatch" style="border-color: var(--accent); border-top-style: dashed"></span>' + esc(lang === 'zh' ? '计划态' : 'planned') + '</span>'
      + '<span class="chip"><span class="swatch" style="border-color: var(--danger); border-top-style: dotted"></span>' + esc(lang === 'zh' ? '已废弃' : 'deprecated') + '</span>'
    main.appendChild(bar)
  }

  /** 文本截断（保持单行，超长加省略号）。 */
  function clipText(s, maxW, fs) {
    var t = String(s)
    if (estWidth(t, fs) <= maxW) return t
    while (t.length > 1 && estWidth(t + '…', fs) > maxW) t = t.slice(0, -1)
    return t + '…'
  }

  function renderCrossEdges(main, m, kids) {
    var kidsSet = {}
    kids.forEach(function (id) { kidsSet[id] = true })
    var outs = [], ins = []
    kids.forEach(function (id) {
      var km = mods[id]
      ;(km.deps || []).forEach(function (d) {
        if (!kidsSet[d.to]) outs.push({ from: id, dep: d })
      })
      ;(depIn[id] || []).forEach(function (e) {
        if (!kidsSet[e.from]) ins.push({ to: id, edge: e })
      })
    })
    var box = el('div', 'crosslist')
    box.appendChild(el('h3', null, '跨层箭头'))
    if (outs.length === 0 && ins.length === 0) {
      box.appendChild(el('div', 'hint', '本层没有指向外部或来自外部的箭头'))
    }
    outs.forEach(function (o) {
      var row = el('div', 'row')
      row.innerHTML = esc(o.from) + ' → ' + linkTo(o.dep.to)
        + ' <span class="hint">(' + esc(o.dep.kind) + (o.dep.label ? ' · ' + esc(L(o.dep.label)) : '') + ')</span>'
        + (o.dep.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    ins.forEach(function (o) {
      var row = el('div', 'row')
      row.innerHTML = esc(o.to) + ' ← ' + linkTo(o.edge.from)
        + ' <span class="hint">(' + esc(o.edge.kind) + (o.edge.label ? ' · ' + esc(L(o.edge.label)) : '') + ')</span>'
        + (o.edge.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    main.appendChild(box)
  }

  function renderInheritedApis(main, m) {
    var kids = children[m.id] || []
    var total = m.aggregate.own_api_count + m.aggregate.inherited_api_count
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API（' + total + '）'))
    if (total === 0) { box.appendChild(el('div', 'hint', '本模块及其子树未定义 API')); main.appendChild(box); return }
    var list = el('ul', 'api-list')
    if (m.apis && m.apis.length > 0) {
      m.apis.forEach(function (a) { list.appendChild(apiItem(a)) })
    }
    box.appendChild(list)
    kids.forEach(function (id) {
      box.appendChild(apiGroup(id, 0))
    })
    main.appendChild(box)
  }

  function apiGroup(id, depth) {
    var km = mods[id]
    var own = (km.apis || []).length
    var below = km.aggregate.inherited_api_count
    var total = own + below
    var det = document.createElement('details')
    det.className = 'api-group'
    if (depth === 0) det.setAttribute('open', '')
    var sum = document.createElement('summary')
    sum.innerHTML = esc(L(km.name)) + ' <span class="cnt">' + esc(id) + ' · ' + total + '</span>'
    det.appendChild(sum)
    var inner = document.createElement('div')
    var ul = document.createElement('ul')
    ul.className = 'api-list'
    ;(km.apis || []).forEach(function (a) { ul.appendChild(apiItem(a)) })
    inner.appendChild(ul)
    var kids = children[id] || []
    kids.forEach(function (cid) { inner.appendChild(apiGroup(cid, depth + 1)) })
    det.appendChild(inner)
    return det
  }

  function apiItem(a) {
    var li = document.createElement('li')
    li.innerHTML = '<span class="key">' + esc(a.key || a.protocol + ':' + a.path) + '</span>'
      + '<span class="desc">' + esc(L(a.description)) + '</span>'
    return li
  }

  function renderLeafDetail(main, m) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API（' + (m.apis || []).length + '）'))
    if (!m.apis || m.apis.length === 0) box.appendChild(el('div', 'hint', '该叶子模块未定义 API（无接口的功能单元）'))
    else {
      var ul = el('ul', 'api-list')
      m.apis.forEach(function (a) { ul.appendChild(apiItem(a)) })
      box.appendChild(ul)
    }
    var outs = m.deps || []
    box.appendChild(el('h3', null, '出向箭头（' + outs.length + '）'))
    outs.forEach(function (d) {
      var row = el('div', 'row')
      row.innerHTML = '→ ' + linkTo(d.to) + ' <span class="hint">(' + esc(d.kind) + (d.label ? ' · ' + esc(L(d.label)) : '') + ')</span>' + (d.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    var ins = depIn[m.id] || []
    box.appendChild(el('h3', null, '入向箭头（' + ins.length + '）'))
    ins.forEach(function (e) {
      var row = el('div', 'row')
      row.innerHTML = '← ' + linkTo(e.from) + ' <span class="hint">(' + esc(e.kind) + (e.label ? ' · ' + esc(L(e.label)) : '') + ')</span>' + (e.cross_tree ? '<span class="badge">跨树</span>' : '')
      box.appendChild(row)
    })
    main.appendChild(box)
  }

  function renderOutline(main) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, '大纲（' + roots.length + ' 棵树 · ' + stats.module_count + ' 模块）'))
    var wrap = el('div', 'outline')
    var ul = document.createElement('ul')
    roots.forEach(function (id) { ul.appendChild(outlineItem(id)) })
    wrap.appendChild(ul)
    box.appendChild(wrap)
    main.appendChild(box)
  }

  function outlineItem(id) {
    var m = mods[id]
    var li = document.createElement('li')
    var a = document.createElement('a')
    a.href = '#module=' + encodeURIComponent(id)
    a.textContent = L(m.name) + ' — ' + id
    li.appendChild(a)
    li.appendChild(document.createTextNode(' '))
    var s = document.createElement('span')
    s.className = 'stat'
    s.textContent = '[模块 ' + (m.aggregate.descendant_count + 1) + ' · API ' + (m.aggregate.own_api_count + m.aggregate.inherited_api_count) + ']'
    li.appendChild(s)
    var kids = children[id] || []
    if (kids.length > 0) {
      var ul = document.createElement('ul')
      kids.forEach(function (k) { ul.appendChild(outlineItem(k)) })
      li.appendChild(ul)
    }
    return li
  }

  function renderApis(main) {
    var box = el('div', 'section')
    box.appendChild(el('h2', null, 'API 浏览器（' + Object.keys(apiIndex).length + '）'))
    var input = document.createElement('input')
    input.id = 'apiFilter'
    input.placeholder = '过滤（method / path / protocol）'
    input.style.cssText = 'width:100%;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;margin-bottom:8px;'
    box.appendChild(input)
    var table = document.createElement('table')
    var keys = Object.keys(apiIndex).sort()
    var MAX = 400
    function draw(filter) {
      table.innerHTML = '<tr><th>API</th><th>归属模块</th></tr>'
      var shown = 0
      for (var i = 0; i < keys.length && shown < MAX; i++) {
        var k = keys[i]
        if (filter && k.toLowerCase().indexOf(filter) === -1 && mods[apiIndex[k]].id.toLowerCase().indexOf(filter) === -1) continue
        var tr = document.createElement('tr')
        var td1 = document.createElement('td')
        var a1 = document.createElement('a')
        a1.href = '#api=' + encodeURIComponent(k)
        a1.textContent = k
        td1.appendChild(a1)
        var td2 = document.createElement('td')
        var a2 = document.createElement('a')
        a2.href = '#module=' + encodeURIComponent(apiIndex[k])
        a2.textContent = apiIndex[k]
        td2.appendChild(a2)
        tr.appendChild(td1); tr.appendChild(td2)
        table.appendChild(tr)
        shown++
      }
      if (shown >= MAX) {
        var tr = document.createElement('tr')
        var td = document.createElement('td')
        td.colSpan = 2
        td.className = 'hint'
        td.textContent = '已显示前 ' + MAX + ' 条，请用过滤缩小范围'
        tr.appendChild(td)
        table.appendChild(tr)
      }
    }
    draw('')
    input.oninput = function () { draw(input.value.trim().toLowerCase()) }
    box.appendChild(table)
    main.appendChild(box)
  }

  function highlightApi() {
    var key = current.apiKey
    var nodes = document.querySelectorAll('.key')
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].textContent === key) {
        nodes[i].scrollIntoView({ block: 'center' })
        nodes[i].style.outline = '2px solid var(--accent)'
      }
    }
  }

  function linkTo(id) {
    return '<a href="#module=' + encodeURIComponent(id) + '">' + esc(id) + '</a>'
  }
  function oneLine(s, max) { var l = (s || '').split('\n')[0]; return l.length > max ? l.slice(0, max) + '…' : l }
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d }

  var tip = document.getElementById('tooltip')
  var tipTimer = null
  function showTip(anchor, m) {
    tipTimer = setTimeout(function () {
      tip.innerHTML = '<div class="t-name">' + esc(L(m.name)) + ' <span class="hint">' + esc(m.id) + '</span></div>'
        + '<div class="t-desc">' + esc(L(m.description)) + '</div>'
        + '<div class="t-meta">' + (m.state ? (m.state === 'planned' ? '计划态 · ' : m.state === 'deprecated' ? '已废弃 · ' : '') : '') + '模块 ' + (m.aggregate.descendant_count + 1) + ' · API ' + (m.aggregate.own_api_count + m.aggregate.inherited_api_count) + '</div>'
      tip.style.display = 'block'
    }, 250)
    document.addEventListener('mousemove', moveTip)
    var r = anchor.getBoundingClientRect()
    moveTip({ clientX: r.right + 8, clientY: r.top })
  }
  function moveTip(e) {
    var pad = 12
    var w = tip.offsetWidth || 280
    var x = Math.min(e.clientX + pad, window.innerWidth - w - 8)
    var y = e.clientY + pad
    if (y + 120 > window.innerHeight) y = e.clientY - 140
    tip.style.left = x + 'px'
    tip.style.top = y + 'px'
  }
  function hideTip() {
    clearTimeout(tipTimer)
    tip.style.display = 'none'
    document.removeEventListener('mousemove', moveTip)
  }

  var input = document.getElementById('searchInput')
  var drop = document.getElementById('searchDrop')
  var searchTimer = null
  input.addEventListener('input', function () {
    clearTimeout(searchTimer)
    searchTimer = setTimeout(function () {
      var q = input.value.trim().toLowerCase()
      drop.innerHTML = ''
      if (!q) { drop.classList.remove('open'); return }
      var hits = []
      for (var i = 0; i < corpus.length && hits.length < 20; i++) {
        if (corpus[i].text.indexOf(q) >= 0) hits.push(corpus[i])
      }
      hits.forEach(function (h) {
        var item = el('div', 'item')
        if (h.kind === 'module') {
          item.innerHTML = esc(h.id) + '<div class="sub">模块</div>'
          item.onclick = function () { input.value = ''; drop.classList.remove('open'); goto('#module=' + encodeURIComponent(h.id)) }
        } else {
          item.innerHTML = esc(h.id) + '<div class="sub">API · ' + esc(h.moduleId) + '</div>'
          item.onclick = function () { input.value = ''; drop.classList.remove('open'); goto('#api=' + encodeURIComponent(h.id)) }
        }
        drop.appendChild(item)
      })
      drop.classList.add('open')
    }, 150)
  })
  document.addEventListener('click', function (e) {
    if (e.target !== input && e.target !== drop) drop.classList.remove('open')
  })

  document.getElementById('btnLang').addEventListener('click', function () {
    lang = lang === 'zh' ? 'en' : 'zh'
    try { localStorage.setItem('normify-lang', lang) } catch (e) {}
    render()
  })
  document.getElementById('btnTheme').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', t)
    try { localStorage.setItem('normify-theme', t) } catch (e) {}
  })
  document.getElementById('btnOutline').addEventListener('click', function () { goto('#view=outline') })
  document.getElementById('btnApis').addEventListener('click', function () { goto('#view=apis') })
  window.addEventListener('hashchange', function () { current = parseHash(); render() })

  initTheme()
  render()
})()
</script>
</body>
</html>
