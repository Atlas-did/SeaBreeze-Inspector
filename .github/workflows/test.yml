name: Test Suite

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deps-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml opencv-python pygame

      - name: Run dependency check (CI mode)
        env:
          SDL_VIDEODRIVER: dummy
        run: python scripts/check_deps.py --ci --json

  test:
    needs: deps-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-2.0-0 libsdl2-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run dependency check
        env:
          SDL_VIDEODRIVER: dummy
        run: python scripts/check_deps.py --ci

      - name: Run tests (Ubuntu with xvfb)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python -m pytest tests/ -v --tb=short

      - name: Run tests (Windows headless)
        if: runner.os == 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -v --tb=short

      - name: Lint (flake8, report-only)
        # P0-4 注: 全仓尚有历史 lint 债(F401/E128/E261 等约 27 处)未一次清理,
        # 此处只报告不阻断, 避免历史债阻断本轮 P0 安全修复的合入。
        # 待 lint 债清零后再移除 --exit-zero。
        if: runner.os == 'Linux'
        run: python -m flake8 backend/ --count --exit-zero --max-line-length=120 --extend-ignore=E501,W503

      - name: Sim headless smoke test
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONIOENCODING: utf-8
        run: python scripts/smoke_test_sim.py --frames 10

      - name: Test summary
        if: always()
        shell: bash
        run: python -m pytest tests/ --tb=no -q 2>/dev/null || echo "(pytest summary skipped)"
