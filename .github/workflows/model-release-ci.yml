name: Model Release CI (weights pinned by SHA256)

# 只在发布标签 / 手动触发时运行 —— 因为它要求受控模型仓库可用。
#   1) 从受控仓库按 data/model_manifest.json 登记的 SHA256 拉取权重;
#   2) 按**内容指纹**校验模型清单(SHA256 + 字节数 + release provenance):
#      审计第 7 条 —— 绝不比对 mtime, 因为权重是刚下载的, mtime 必然与
#      清单生成时不同; 也不比对本机绝对路径/平台串(见 verify_model_manifest.py);
#   3) 依赖检查进入"必须有权重"模式;
#   4) 真实模型加载 + 推理验证;
#   5) 部署配置(config/yolo_config.yaml)指向的权重必须存在且已登记。
#
# 仓库地址来自仓库变量/密钥 MODEL_BASE_URL。**未配置时本流水线按设计失败**:
# 发布流水线不允许在"没有真实权重"的情况下显示通过(这是有意为之, 不是回归)。
# 同理, data/model_manifest.json 必须由发布源提供: 没有受控清单就无法按 SHA256
# 拉取, 也就无法证明"发的是哪一份权重"—— 此时同样按设计失败(退出码 2)。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'data/model_manifest.json'
      - 'config/yolo_config.yaml'
      - '.github/workflows/model-release-ci.yml'

jobs:
  model-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Fetch weights from controlled registry (SHA256 pinned)
        env:
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          PYTHONUTF8: 1
        run: python scripts/fetch_weights.py --manifest data/model_manifest.json --dest data/weights

      - name: Verify model manifest (content fingerprint = SHA256 + bytes)
        # 权威判据 = 权重 SHA256 + 字节数 + release_candidate 的 provenance。
        # 非权威(显式忽略): mtime_ns/mtime_utc、generated_at、绝对路径、平台串。
        # 第二行是总入口 scripts/verify_manifest.py 的等价调用(--only models),
        # 保留它以免破坏既有调用面, 并顺带守住"总入口仍然可用"。
        run: |
          python scripts/verify_model_manifest.py
          python scripts/verify_manifest.py --only models

      - name: Dependency check (weights REQUIRED here)
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: python scripts/check_deps.py --ci

      - name: Deployment config must point at a registered weight
        run: python scripts/check_deployment_config.py

      - name: Model load + inference validation
        env:
          SDL_VIDEODRIVER: dummy
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: python -m pytest tests/test_vision.py -v --tb=short
